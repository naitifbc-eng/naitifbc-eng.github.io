<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naïtif Laiterie — Coming Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #FFFFFF;
      color: #1A1810;
      font-family: 'Inter', sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 24px;
    }

    .container {
      text-align: center;
      max-width: 480px;
      width: 100%;
    }

    .top-rule {
      width: 200px;
      height: 2px;
      background: #1A1810;
      margin: 0 auto 40px;
      opacity: 0;
      animation: fadeUp 0.9s ease 0.1s forwards;
    }

    .wordmark {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(64px, 14vw, 100px);
      font-weight: 400;
      letter-spacing: 0.14em;
      color: #1A1810;
      line-height: 1;
      margin-bottom: 16px;
      opacity: 0;
      animation: fadeUp 0.9s ease 0.3s forwards;
    }

    .subtitle {
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 48px;
      opacity: 0;
      animation: fadeUp 0.9s ease 0.5s forwards;
    }

    .mid-rule {
      width: 40px;
      height: 1px;
      background: #C9A96E;
      margin: 0 auto 32px;
      opacity: 0;
      animation: fadeUp 0.9s ease 0.6s forwards;
    }

    .badge {
      display: inline-block;
      background: #1A1810;
      color: #F5F0E8;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 6px 18px;
      opacity: 0;
      animation: fadeUp 0.9s ease 0.75s forwards;
    }

    .bottom-rule {
      width: 200px;
      height: 1px;
      background: #e8e8e8;
      margin: 48px auto 20px;
      opacity: 0;
      animation: fadeUp 0.9s ease 0.9s forwards;
    }

    .footer {
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #ccc;
      opacity: 0;
      animation: fadeUp 0.9s ease 1.1s forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; transform: none !important; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="top-rule"></div>
  <h1 class="wordmark">Naïtif</h1>
  <p class="subtitle">Laiterie &nbsp;·&nbsp; Coquitlam, BC</p>
  <div class="mid-rule"></div>
  <div class="badge">Coming Soon</div>
  <div class="bottom-rule"></div>
  <p class="footer">Booth &amp; Moore · Maillardville · Est. 2026</p>
</div>
</body>
</html>
